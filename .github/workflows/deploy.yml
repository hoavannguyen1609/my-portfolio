# Build Angular và deploy lên GitHub Pages mỗi khi push lên main.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sinh src/environments/env.generated.ts từ Secrets/Variables của repo
      # (Settings → Secrets and variables → Actions). Thiếu Firebase thì tính năng tự tắt;
      # khai thiếu một phần thì --strict làm build dừng để không deploy cấu hình hỏng.
      - name: Environment
        run: node scripts/set-env.mjs --strict
        env:
          NG_APP_ENV_NAME: production
          NG_APP_FIREBASE_API_KEY: ${{ secrets.NG_APP_FIREBASE_API_KEY }}
          NG_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.NG_APP_FIREBASE_AUTH_DOMAIN }}
          NG_APP_FIREBASE_PROJECT_ID: ${{ secrets.NG_APP_FIREBASE_PROJECT_ID }}
          NG_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.NG_APP_FIREBASE_STORAGE_BUCKET }}
          NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NG_APP_FIREBASE_MESSAGING_SENDER_ID }}
          NG_APP_FIREBASE_APP_ID: ${{ secrets.NG_APP_FIREBASE_APP_ID }}
          NG_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.NG_APP_FIREBASE_MEASUREMENT_ID }}
          NG_APP_RECAPTCHA_SITE_KEY: ${{ secrets.NG_APP_RECAPTCHA_SITE_KEY }}
          NG_APP_CLARITY_PROJECT_ID: ${{ vars.NG_APP_CLARITY_PROJECT_ID }}
          NG_APP_ENABLE_ANALYTICS: ${{ vars.NG_APP_ENABLE_ANALYTICS || 'true' }}
          NG_APP_ENABLE_PERFORMANCE: ${{ vars.NG_APP_ENABLE_PERFORMANCE || 'true' }}
          NG_APP_ENABLE_REMOTE_CONFIG: ${{ vars.NG_APP_ENABLE_REMOTE_CONFIG || 'true' }}
          NG_APP_ENABLE_CONTACT_FORM: ${{ vars.NG_APP_ENABLE_CONTACT_FORM || 'true' }}

      # Repo <user>.github.io phục vụ ở "/", repo thường phục vụ ở "/<tên-repo>/"
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          npx ng build --base-href "$BASE"
          node scripts/postbuild-gh-pages.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/nvh-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
